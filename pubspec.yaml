name: charge_mate
description: "ChargeMate – Smart EV Charging Station Finder & Explore Platform"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ─────────────────────────────────────────────
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # ── Dependency Injection ─────────────────────────────────────────
  get_it: ^8.0.3

  # ── Network ──────────────────────────────────────────────────────
  dio: ^5.8.0

  # ── Routing ──────────────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Maps & Location ─────────────────────────────────────────────
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  permission_handler: ^11.4.0

  # ── Storage ──────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── Functional Programming ──────────────────────────────────────
  dartz: ^0.10.1

  # ── UI / Design ─────────────────────────────────────────────────
  google_fonts: ^6.2.1
  iconsax_flutter: ^1.0.0+1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # ── Image ────────────────────────────────────────────────────────
  image_picker: ^1.1.2

  # ── Utilities ────────────────────────────────────────────────────
  intl: ^0.19.0
  url_launcher: ^6.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/mock_data/
